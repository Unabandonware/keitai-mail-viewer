<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Keitai Mail Viewer</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<center>
<!-- Deco-mail template viewer -->
<iframe id="viewer" sandbox="allow-scripts"></iframe>

<!-- File drop zone -->
<label id="drop-zone">
  Drop .dmt/.vmg here, or click to upload.
  <input type="file" id="file-input" accept=".dmt,.vmg" />
</label>

<!-- Script -->
<script src="script.js"></script>

</center>
</body>
</html>
