<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Keitai Mail Viewer</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<center>
<!-- Deco-mail template viewer -->
<iframe id="viewer" sandbox="allow-scripts"></iframe>
<div id="sound-downloads" hidden></div>

<!-- Rotation -->
<fieldset id ="rotation">
  <legend>Screen Orientation:</legend>

  <div>
    <input type="radio" id="portrait" name="orientation" value="portrait" checked />
    <label for="portrait">Portrait</label>
  </div>

  <div>
    <input type="radio" id="landscape" name="orientation" value="landscape" />
    <label for="landscape">Landscape</label>
  </div>
</fieldset>


<!-- File drop zone -->
<label id="drop-zone">
  Drop email template here, or click to upload.
  <input type="file" id="file-input" accept=".dmt,.vmg,.hmt" />
</label>

<!-- Script -->
<script src="pictograms.js"></script>
<script src="script.js"></script>

</center>
</body>
</html>
